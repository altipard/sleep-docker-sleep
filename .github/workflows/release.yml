# Release from main: commitizen computes the next version from the commits since the last
# tag. Versions live in git tags only and are stamped into binaries and the image.
name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  IMAGE: ghcr.io/${{ github.repository }}
  RUST_TOOLCHAIN: "1.90.0"

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: require the release signing key
        env:
          SDS_SIGNING_PRIVATE_KEY: ${{ secrets.SDS_SIGNING_PRIVATE_KEY }}
        run: test -n "$SDS_SIGNING_PRIVATE_KEY" || { echo "SDS_SIGNING_PRIVATE_KEY is not configured"; exit 1; }
      - run: pip install --quiet commitizen==4.8.3
      - id: next
        # Accept only a version-looking line from commitizen's output.
        run: |
          VERSION=$(cz bump --get-next --yes 2>/dev/null | grep -E '^[0-9]+\.[0-9]+\.[0-9]+' | tail -n1 || true)
          git fetch --quiet --tags origin
          if [ -n "$VERSION" ] && git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            echo "tag $VERSION already exists; nothing to release"
            VERSION=""
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "next version: ${VERSION:-none (no release-relevant commits)}"

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features

  binaries:
    needs: [version, verify]
    if: needs.version.outputs.version != ''
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu, name: sds-linux-x86_64 }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: sds-linux-aarch64 }
          - { os: macos-latest,     target: aarch64-apple-darwin,      name: sds-macos-aarch64 }
          - { os: macos-latest,     target: x86_64-apple-darwin,       name: sds-macos-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
      - name: stamp version
        run: sed -i.bak "s/^version = \".*\"/version = \"${{ needs.version.outputs.version }}\"/" Cargo.toml && rm Cargo.toml.bak
      - run: cargo build --locked --release --target ${{ matrix.target }}
        env:
          SDS_VERSION: ${{ needs.version.outputs.version }}
      - run: cp target/${{ matrix.target }}/release/sds ${{ matrix.name }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.name }}
          path: ${{ matrix.name }}
          if-no-files-found: error

  image:
    needs: [version, verify]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: SDS_VERSION=${{ needs.version.outputs.version }}
          tags: |
            ${{ env.IMAGE }}:${{ needs.version.outputs.version }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: [version, binaries, image]
    if: needs.version.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          pattern: sds-*
          merge-multiple: true
      - name: sign release binaries
        env:
          SDS_SIGNING_PRIVATE_KEY: ${{ secrets.SDS_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$SDS_SIGNING_PRIVATE_KEY" ]; then
            echo "SDS_SIGNING_PRIVATE_KEY is required; refusing to publish unsigned binaries"
            exit 1
          fi
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$SDS_SIGNING_PRIVATE_KEY" > "$key"
          chmod 600 "$key"
          for file in dist/sds-*; do
            openssl pkeyutl -sign -rawin -inkey "$key" -in "$file" -out "$file.sig"
          done
          openssl pkey -in "$key" -pubout -out dist/sds-release-public-key.pem
      - name: tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          git tag "$VERSION" "$GITHUB_SHA"
          git push origin "$VERSION"
          gh release create "$VERSION" dist/* \
            --title "$VERSION" \
            --generate-notes \
            --notes "Image: \`${IMAGE}:${VERSION}\`"
