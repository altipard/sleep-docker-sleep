# https://taskfile.dev — `task --list` shows all tasks.
version: "3"

vars:
  BIN: target/release/sds
  CONFIG: '{{.CONFIG | default "sds.toml"}}'
  SMOKE_NAME: sds-smoke
  SMOKE_PORT: "18081"
  SMOKE_ADMIN: 127.0.0.1:9901

env:
  CARGO_TERM_COLOR: always

tasks:
  default:
    desc: Lint, test and build (what CI runs on a merge request)
    cmds:
      - task: lint
      - task: test
      - task: build

  build:
    desc: Debug build
    sources: [src/**/*.rs, Cargo.toml, Cargo.lock]
    generates: [target/debug/sds]
    cmds:
      - cargo build

  release:
    desc: Optimised release build
    sources: [src/**/*.rs, Cargo.toml, Cargo.lock]
    generates: ["{{.BIN}}"]
    cmds:
      - cargo build --release --locked

  install:
    desc: Install the release binary to /usr/local/bin (needs sudo)
    deps: [release]
    cmds:
      - sudo install -m 755 {{.BIN}} /usr/local/bin/sds
      - sds --version

  test:
    desc: Unit and CLI tests
    cmds:
      - cargo test --locked

  lint:
    desc: Format check and clippy with warnings as errors
    cmds:
      - cargo fmt --all -- --check
      - cargo clippy --all-targets -- -D warnings

  fmt:
    desc: Format the code
    cmds:
      - cargo fmt --all

  audit:
    desc: Dependency vulnerability audit (installs cargo-audit on demand)
    cmds:
      - cargo audit --version >/dev/null 2>&1 || cargo install cargo-audit --locked
      - cargo audit

  commits:
    desc: Check commit messages on this branch against Conventional Commits
    cmds:
      - cz check --rev-range "$(git merge-base origin/main HEAD 2>/dev/null || git rev-list --max-parents=0 HEAD)..HEAD"

  run:
    desc: Run the daemon with the terminal dashboard (CONFIG=path to override)
    cmds:
      - cargo run -- run --config {{.CONFIG}}

  run:headless:
    desc: Run the daemon with logs only
    cmds:
      - cargo run -- run --headless --config {{.CONFIG}}

  check:
    desc: Validate config, Docker access and discovered groups
    cmds:
      - cargo run --quiet -- check --config {{.CONFIG}}

  status:
    desc: Show groups of the running daemon
    cmds:
      - cargo run --quiet -- status --config {{.CONFIG}} {{.CLI_ARGS}}

  init:
    desc: Write a commented sds.toml into the project directory
    status: ["test -f {{.CONFIG}}"]
    cmds:
      - cargo run --quiet -- init --path {{.CONFIG}}

  docs:
    desc: Build the handbook with mdBook (installs it on demand)
    cmds:
      - mdbook --version >/dev/null 2>&1 || cargo install mdbook --locked
      - mdbook build docs

  docs:serve:
    desc: Serve the handbook with live reload
    cmds:
      - mdbook --version >/dev/null 2>&1 || cargo install mdbook --locked
      - mdbook serve docs --open

  docker:build:
    desc: Build the sds container image
    cmds:
      - docker build -t sleep-docker-sleep:dev .

  docker:lint:
    desc: Lint the Dockerfile with hadolint
    cmds:
      - docker run --rm -i hadolint/hadolint < Dockerfile

  smoke:
    desc: End-to-end check against real Docker (labelled nginx, forward-auth wake, idle stop)
    deps: [build]
    cmds:
      - defer: { task: smoke:down }
      - task: smoke:up
      - |
        set -e
        SDS=target/debug/sds
        CFG=target/smoke.toml
        printf '[admin]\nbind = "{{.SMOKE_ADMIN}}"\n' > "$CFG"
        "$SDS" run --headless --config "$CFG" > target/smoke.log 2>&1 &
        PID=$!
        trap 'kill $PID 2>/dev/null || true' EXIT
        sleep 3
        "$SDS" status --config "$CFG"
        "$SDS" sleep smoke --config "$CFG"; sleep 3
        test "$(docker inspect -f '{{"{{"}}.State.Status{{"}}"}}' {{.SMOKE_NAME}})" = exited
        test "$(curl -s -o /dev/null -w '%{http_code}' http://{{.SMOKE_ADMIN}}/_sds/check/smoke)" = 200
        test "$(docker inspect -f '{{"{{"}}.State.Status{{"}}"}}' {{.SMOKE_NAME}})" = running
        echo "waiting for idle stop (20s)…"; sleep 25
        test "$(docker inspect -f '{{"{{"}}.State.Status{{"}}"}}' {{.SMOKE_NAME}})" = exited
        echo "smoke test passed"

  smoke:up:
    internal: true
    cmds:
      - docker rm -f {{.SMOKE_NAME}} >/dev/null 2>&1 || true
      - >-
        docker run -d --name {{.SMOKE_NAME}}
        -l sds.enable=true -l sds.group=smoke -l sds.idle_timeout=20s
        -l sds.start_grace=1s -l sds.health=http://127.0.0.1:{{.SMOKE_PORT}}/
        -p 127.0.0.1:{{.SMOKE_PORT}}:80 nginx:alpine >/dev/null

  smoke:down:
    internal: true
    cmds:
      - docker rm -f {{.SMOKE_NAME}} >/dev/null 2>&1 || true

  clean:
    desc: Remove build artefacts
    cmds:
      - cargo clean
      - rm -rf docs/book
