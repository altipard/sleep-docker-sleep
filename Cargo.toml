[package]
name = "sleep-docker-sleep"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Scale Docker containers to zero on idle and wake them on the first request"
license = "MIT"
repository = "https://github.com/altipard/sleep-docker-sleep"
readme = "README.md"
keywords = ["docker", "proxy", "scale-to-zero", "cli"]
categories = ["command-line-utilities"]
publish = false

[lib]
name = "sds"
path = "src/lib.rs"

[[bin]]
name = "sds"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
axum = "0.8.9"
bollard = "0.21.1"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
comfy-table = "8.0.1"
directories = "6.0.0"
futures-util = "0.3.34"
http = "1.5.0"
http-body-util = "0.1.5"
humantime = "2.4.0"
humantime-serde = "1.1.1"
hyper = { version = "1.12.0", features = ["full"] }
hyper-util = { version = "0.1.21", features = ["full"] }
owo-colors = "4.4.0"
ratatui = "0.30.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = "0.7.20"
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[dev-dependencies]
assert_cmd = "2.2.2"
predicates = "3.1.4"
tempfile = "3.27.0"
