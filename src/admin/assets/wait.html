<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}} · {{group}}</title>
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<style>
  :root { color-scheme: light dark; --fg: #1b1f24; --bg: #f6f7f9; --muted: #6b7280; --accent: #2563eb; --card: #fff; --border: #e5e7eb; }
  @media (prefers-color-scheme: dark) { :root { --fg: #e6e8eb; --bg: #0f1216; --muted: #9aa3af; --accent: #60a5fa; --card: #161b22; --border: #2a3139; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; padding: 16px; }
  .logo { width: 64px; height: 64px; margin-bottom: 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 32px; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,.08); }
  h1 { font-size: 1.25rem; margin: 16px 0 8px; }
  p { margin: 0 0 8px; color: var(--muted); }
  .group { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: .9rem; color: var(--fg); }
  .spinner { width: 40px; height: 40px; margin: 0 auto; border: 4px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
  .spinner[data-state="failed"], .spinner[data-state="overloaded"] { animation: none; border-color: #ef4444; }
  @keyframes spin { to { transform: rotate(360deg); } }
  small { color: var(--muted); font-size: .8rem; }
</style>
</head>
<body>
  <main class="card">
    <div class="spinner" data-state="{{state}}"></div>
    <img class="logo" src="/logo.svg" alt="" width="64" height="64">
    <h1>{{title}}</h1>
    <p class="group">{{group}}</p>
    <p>{{message}}</p>
    <small>sleep-docker-sleep · state: {{state}}</small>
  </main>
</body>
</html>
