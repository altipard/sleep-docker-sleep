# Generated with: sds integrate nginx nginx-host --host app.example.com --upstream http://127.0.0.1:18080
# Put the `map` once into the http {} context.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

upstream sds_nginx_host_app {
    server 127.0.0.1:18080;
    keepalive 16;
}

server {
    listen 80;
    server_name app.example.com;

    location / {
        auth_request /_sds_check;
        error_page 403 = @sds_wait;
        error_page 500 502 = @sds_bypass;

        proxy_pass http://sds_nginx_host_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }

    location = /_sds_check {
        internal;
        proxy_pass http://127.0.0.1:9900/_sds/check/nginx-host?deny=403;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 65s;
        proxy_connect_timeout 2s;
    }

    location @sds_wait {
        proxy_pass http://127.0.0.1:9900/_sds/wait/nginx-host;
        proxy_set_header Accept "text/html";
        proxy_intercept_errors off;
    }

    location @sds_bypass {
        proxy_pass http://sds_nginx_host_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
