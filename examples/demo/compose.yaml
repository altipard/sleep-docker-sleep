# Ten tiny web servers, each its own sds group with a short idle timeout, so the
# dashboard shows groups waking and sleeping within a minute instead of hours.
#
#   docker compose up -d        # start (or `up` to watch the container logs)
#   sds run                     # on the host; discovers the ten groups via labels
#   ./traffic.sh                # random requests through the sds proxies, Ctrl-C to stop
#
# Each service publishes its port on loopback (1810x) and gets a native sds proxy in
# front (1820x). Requests must go through the proxy port, otherwise sds sees no activity.
services:
  api:  # busy service, rarely sleeps
    image: traefik/whoami:v1.11
    command: ["--name", "api"]
    ports: ["127.0.0.1:18101:80"]
    labels:
      sds.enable: "true"
      sds.group: "api"
      sds.idle_timeout: "30s"
      sds.start_grace: "1s"
      sds.health: "http://127.0.0.1:18101/"
      sds.proxy.listen: "127.0.0.1:18201"
      sds.proxy.upstream: "127.0.0.1:18101"
      sds.proxy.mode: "http"

  web:  # busy service, rarely sleeps
    image: traefik/whoami:v1.11
    command: ["--name", "web"]
    ports: ["127.0.0.1:18102:80"]
    labels:
      sds.enable: "true"
      sds.group: "web"
      sds.idle_timeout: "30s"
      sds.start_grace: "1s"
      sds.health: "http://127.0.0.1:18102/"
      sds.proxy.listen: "127.0.0.1:18202"
      sds.proxy.upstream: "127.0.0.1:18102"
      sds.proxy.mode: "http"

  shop:
    image: traefik/whoami:v1.11
    command: ["--name", "shop"]
    ports: ["127.0.0.1:18103:80"]
    labels:
      sds.enable: "true"
      sds.group: "shop"
      sds.idle_timeout: "45s"
      sds.start_grace: "1s"
      sds.health: "http://127.0.0.1:18103/"
