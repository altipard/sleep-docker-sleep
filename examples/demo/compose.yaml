      sds.proxy.upstream: "127.0.0.1:18103"
      sds.proxy.mode: "http"

  blog:  # waiting page instead of holding the request
    image: traefik/whoami:v1.11
    command: ["--name", "blog"]
    ports: ["127.0.0.1:18104:80"]
    labels:
      sds.enable: "true"
      sds.group: "blog"
      sds.idle_timeout: "20s"
      sds.wake: "page"
      sds.start_grace: "1s"
      sds.health: "http://127.0.0.1:18104/"
      sds.proxy.listen: "127.0.0.1:18204"
      sds.proxy.upstream: "127.0.0.1:18104"
      sds.proxy.mode: "http"

  docs:
